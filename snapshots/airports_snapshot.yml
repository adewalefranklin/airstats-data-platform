snapshots:
  - name: scd_airports
    relation: ref('airports') # source table for airports
    config:
      unique_key: airport_id
      strategy: check # one call also use "all" argument to check all columns for changes, but this is not cost effective for large tables. Use "check" to check only the columns specified in the check_cols argument.
      check_cols:
        - airport_name
        - airport_type
        - country_code
        - region_code
        - municipality
        - scheduled_service
      hard_deletes: invalidate